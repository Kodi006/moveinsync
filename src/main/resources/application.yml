spring:
  application:
    name: roster-sync
  datasource:
    url: jdbc:postgresql://localhost:5432/roster
    username: roster
    password: roster
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# Reconciliation safety brake (Commit 5).
# missing / activeInStore > 0.30  → abort and require operator approval.
roster:
  outbox:
    batch-size: 100
    poll-interval-ms: 5000
  reconciliation:
    safety-brake-threshold: 0.30
    cron: "${ROSTER_RECONCILIATION_CRON:0 0 2 * * *}"
    tenant-id: "${ROSTER_RECONCILIATION_TENANT_ID:}"
    export-path: "${ROSTER_RECONCILIATION_EXPORT_PATH:}"
